<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="right"></div>
<div id="left"></div>
<style>
  body {
    background: #F5D6B4;
    margin: 0px;
  }
  div {
    width: 100%;
    height: 160px;
    position: absolute;
    bottom: -1px;
  }
  #left {
    background: #D86F45;
    transform-origin: top left;
    rotate: 15deg;
    width: 110%;
  }
  #right {
    background: #FFA885;
    transform-origin: top right;
    rotate: -15deg;
  }
</style>
</body>
</html>
