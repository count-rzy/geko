<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="darkBlue"></div>
<div id="white"></div>
<style>
  body {
    background: #4F77FF;
    margin: 0;             
    height: 100vh;         
    display: grid;
    place-items: center;  
  }
  div {
    height: 150px;
    position: absolute;   
  }
  #darkBlue {
    width: 250px;
    background: #003AFF;
    rotate: 45deg;
    translate: 87px 87px;
  }
  #white {
    width: 150px;
    background: #FFFFFF;
    border-radius: 50%;
  }
</style>
</body>
</html>
